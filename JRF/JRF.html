<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SoilSpark · Question Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --blue:#8ecae6;
  --blue-dark:#4f8fae;
  --blue-soft:#eaf6fb;

  --bg:#fffdf9;
  --white:#ffffff;

  --text:#4a3b2a;
  --text-dark:#3d3025;
  --muted:#8a7b6b;

  --border:#eadfce;
  --border-blue:#c8e3ef;

  --brown:#b8956a;
  --brown-light:#f3eadf;

  --yellow:#f4c542;
  --yellow-soft:#fff7d9;

  --success:#7a9e5b;
  --success-soft:#f1f8eb;

  --danger:#c96b5c;
  --danger-soft:#fff1ef;

  --shadow:0 12px 35px rgba(110,85,55,.10);
  --shadow-soft:0 5px 18px rgba(110,85,55,.07);
}

/* =========================
   GLOBAL
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,sans-serif;
  background:
    radial-gradient(
      circle at top right,
      rgba(142,202,230,.16),
      transparent 32%
    ),
    radial-gradient(
      circle at bottom left,
      rgba(244,197,66,.07),
      transparent 28%
    ),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input{
  font:inherit;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  box-shadow:0 4px 18px rgba(110,85,55,.06);
  backdrop-filter:blur(10px);
}

.topbar-inner{
  max-width:1250px;
  margin:auto;
  padding:15px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

/* =========================
   BRAND
========================= */

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  background:var(--blue-soft);
  color:var(--blue-dark);
  border:1px solid var(--border-blue);
  display:grid;
  place-items:center;
  font-size:20px;
}

.brand h1{
  font:800 20px Poppins,sans-serif;
  color:var(--blue-dark);
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

/* =========================
   USER ACTIONS
========================= */

.user-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.user-email{
  background:var(--blue-soft);
  color:var(--blue-dark);
  border:1px solid var(--border-blue);
  padding:9px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  max-width:280px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.logout{
  border:1px solid #f0d1cb;
  background:var(--danger-soft);
  color:var(--danger);
  padding:10px 13px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.logout:hover{
  background:#ffe7e3;
}

/* =========================
   PAGE
========================= */

.page{
  max-width:1250px;
  margin:auto;
  padding:30px 24px 50px;
}

/* =========================
   HERO
========================= */

.hero{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:25px;
}

.hero h2{
  font:800 29px Poppins,sans-serif;
  color:var(--text-dark);
}

.hero p{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

/* =========================
   SEARCH
========================= */

.search-wrap{
  position:relative;
}

.search{
  width:310px;
  height:45px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--white);
  padding:0 15px 0 42px;
  outline:none;
  color:var(--text);
  transition:.2s;
  box-shadow:var(--shadow-soft);
}

.search::placeholder{
  color:#a99d90;
}

.search:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(142,202,230,.18);
}

.search-wrap i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--brown);
}

/* =========================
   TOPIC GRID
========================= */

.topic-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.topic{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.topic:hover{
  transform:translateY(-3px);
  border-color:var(--blue);
  box-shadow:0 16px 38px rgba(110,85,55,.12);
}

.topic-icon{
  width:50px;
  height:50px;
  border-radius:15px;
  background:var(--blue-soft);
  color:var(--blue-dark);
  border:1px solid var(--border-blue);
  display:grid;
  place-items:center;
  font-size:20px;
  margin-bottom:15px;
}

.topic h3{
  font:700 18px Poppins,sans-serif;
  color:var(--text-dark);
}

.topic p{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  margin:6px 0 15px;
}

.topic-foot{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.count{
  font-size:11px;
  font-weight:800;
  color:var(--brown);
}

/* =========================
   OPEN BUTTON
========================= */

.open{
  border:0;
  background:var(--blue-dark);
  color:#fff;
  padding:9px 12px;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.open:hover{
  background:#3f7c99;
  transform:translateY(-1px);
}

/* =========================
   EMPTY / LOADING
========================= */

.empty,
.loading{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  padding:55px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
  box-shadow:var(--shadow-soft);
}

.empty i,
.loading i{
  font-size:32px;
  color:var(--blue);
  margin-bottom:12px;
}

/* =========================
   QUESTION VIEW
========================= */

#questionView{
  display:none;
}

.question-shell{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* =========================
   QUESTION HEADER
========================= */

.question-head{
  padding:18px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  background:#fffefa;
}

.back{
  border:1px solid var(--border);
  background:var(--white);
  color:var(--blue-dark);
  padding:9px 13px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.back:hover{
  background:var(--blue-soft);
  border-color:var(--blue);
}

.topic-title{
  font:700 18px Poppins,sans-serif;
  color:var(--text-dark);
}

.progress{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

/* =========================
   QUESTION AREA
========================= */

.question-area{
  padding:28px;
  max-width:900px;
  margin:auto;
}

.q-label{
  font-size:12px;
  font-weight:800;
  color:var(--brown);
  margin-bottom:12px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.q-text{
  font:700 21px/1.5 Poppins,sans-serif;
  color:var(--text-dark);
  background:
    linear-gradient(
      135deg,
      var(--blue-soft),
      #f8fcfe
    );
  border:1px solid var(--border-blue);
  border-radius:18px;
  padding:21px;
  margin-bottom:22px;
}

/* =========================
   OPTIONS
========================= */

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  display:flex;
  gap:14px;
  align-items:flex-start;
  border:1.5px solid var(--border);
  border-radius:15px;
  padding:15px 17px;
  cursor:pointer;
  transition:.2s;
  background:var(--white);
}

.option:hover{
  border-color:var(--blue);
  background:#fafdff;
  transform:translateX(2px);
}

.option.selected{
  border-color:var(--blue-dark);
  background:var(--blue-soft);
}

.option.correct{
  border-color:var(--success);
  background:var(--success-soft);
}

.option.wrong{
  border-color:var(--danger);
  background:var(--danger-soft);
}

/* =========================
   OPTION LETTER
========================= */

.letter{
  width:30px;
  height:30px;
  min-width:30px;
  border-radius:9px;
  background:var(--brown-light);
  display:grid;
  place-items:center;
  font-weight:800;
  color:var(--text);
}

.option.selected .letter{
  background:var(--blue-dark);
  color:#fff;
}

.option.correct .letter{
  background:var(--success);
  color:#fff;
}

.option.wrong .letter{
  background:var(--danger);
  color:#fff;
}

.option-text{
  font-size:14px;
  line-height:1.5;
  padding-top:4px;
  color:var(--text);
}

/* =========================
   ACTIONS
========================= */

.actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:25px;
}

.action{
  border:0;
  border-radius:11px;
  padding:11px 17px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.secondary{
  background:var(--brown-light);
  color:var(--text);
}

.secondary:hover{
  background:#eadcca;
}

.primary{
  background:var(--blue-dark);
  color:#fff;
}

.primary:hover{
  background:#3f7c99;
}

.disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================
   EXPLANATION
========================= */

.explanation{
  display:none;
  margin-top:20px;
  border:1px solid #d4e5c8;
  background:var(--success-soft);
  border-radius:14px;
  padding:15px;
  color:#4e683e;
  font-size:13px;
  line-height:1.6;
}

.explanation.show{
  display:block;
}

/* =========================
   LOGIN NOTE
========================= */

.login-note{
  display:none;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:18px;
  padding:35px;
  text-align:center;
  box-shadow:var(--shadow-soft);
}

.login-note h3{
  font:700 20px Poppins,sans-serif;
  color:var(--text-dark);
  margin-bottom:7px;
}

.login-note p{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   SMALL YELLOW ACCENT
========================= */

.highlight,
.badge,
.xp{
  background:var(--yellow-soft);
  color:#806719;
  border:1px solid #f0d878;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .topic-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    width:100%;
  }
}

@media(max-width:560px){

  .topbar-inner{
    padding:12px 15px;
  }

  .user-email{
    display:none;
  }

  .page{
    padding:22px 15px 35px;
  }

  .topic-grid{
    grid-template-columns:1fr;
  }

  .question-area{
    padding:20px 15px;
  }

  .q-text{
    font-size:18px;
  }

  .question-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    flex-wrap:wrap;
  }

  .action{
    flex:1;
    min-width:120px;
  }
}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><div class="brand-icon"><i class="fa-solid fa-seedling"></i></div><div><h1>SoilSpark</h1><small>Question Dashboard</small></div></div>
  <div class="user-actions"><div id="userEmail" class="user-email">Checking account...</div><button id="logoutBtn" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div>
</div></header>

<main class="page">
<section id="topicView">
  <div class="hero"><div><h2>Practice by Topic</h2><p>Choose a topic and solve questions</p></div><div class="search-wrap"><i class="fa-solid fa-search"></i><input id="topicSearch" class="search" placeholder="Search topics..."></div></div>
  <div id="topicGrid" class="topic-grid"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading topics...</p></div></div>
</section>

<section id="questionView">
  <div class="question-shell">
    <div class="question-head"><button class="back" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Topics</button><div><div id="topicTitle" class="topic-title">Topic</div><div id="progress" class="progress">Question 1</div></div></div>
    <div class="question-area">
      <div id="qLabel" class="q-label">QUESTION 1</div>
      <div id="qText" class="q-text">Loading question...</div>
      <div id="options" class="options"></div>
      <div id="explanation" class="explanation"></div>
      <div class="actions">
        <button id="prevBtn" class="action secondary"><i class="fa-solid fa-chevron-left"></i> Previous</button>
        <button id="nextBtn" class="action primary">Next <i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
  </div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJ8Zg6qRYa2QrMbKjG4I1B3Dxg1_Z51EI",
  authDomain: "soilspark.firebaseapp.com",
  projectId: "soilspark",
  storageBucket: "soilspark.firebasestorage.app",
  messagingSenderId: "22641848933",
  appId: "1:22641848933:web:4c08ce5046681dbb698c8c",
  measurementId: "G-1M406BN9JK"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let topics=[],questions=[],filteredTopics=[],currentTopic=null,currentIndex=0,answers={};

onAuthStateChanged(auth,async user=>{
  if(!user){
    $("userEmail").textContent="Not signed in";
    $("topicGrid").innerHTML='<div class="login-note" style="display:block;grid-column:1/-1"><h3>Sign in required</h3><p>Please sign in through the SoilSpark login page before opening the question dashboard.</p></div>';
    $("logoutBtn").style.display="none"; return;
  }
  $("userEmail").textContent=user.email||"Student";
  $("logoutBtn").style.display="block";
  await loadTopics();
});

$("logoutBtn").onclick=()=>signOut(auth);
$("topicSearch").addEventListener("input",()=>{const s=$("topicSearch").value.toLowerCase().trim();filteredTopics=topics.filter(t=>(t.name||"").toLowerCase().includes(s));renderTopics()});
$("backBtn").onclick=()=>showTopics();
$("prevBtn").onclick=()=>{if(currentIndex>0){currentIndex--;renderQuestion()}};
$("nextBtn").onclick=()=>{if(currentIndex<questions.length-1){currentIndex++;renderQuestion()}else{showResultMessage()}};

async function loadTopics(){
  try{
    const snap=await getDocs(query(collection(db,"topics"),where("active","==",true)));
    topics=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??9999)-(b.order??9999)||(a.name||"").localeCompare(b.name||""));
    const qSnap=await getDocs(query(collection(db,"questions"),where("active","==",true)));
    const counts={}; qSnap.forEach(d=>{const x=d.data();counts[x.topicId]=(counts[x.topicId]||0)+1});
    topics=topics.map(t=>({...t,count:counts[t.id]||0})).filter(t=>t.count>0);
    filteredTopics=topics; renderTopics();
  }catch(e){console.error(e);$("topicGrid").innerHTML='<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><h3>Unable to load topics</h3><p>Check your Firebase Firestore rules and try again.</p></div>'}
}

function renderTopics(){
  const g=$("topicGrid");
  if(!filteredTopics.length){g.innerHTML='<div class="empty"><i class="fa-regular fa-folder-open"></i><h3>No topics found</h3><p>There are no active topics with questions available yet.</p></div>';return}
  g.innerHTML=filteredTopics.map(t=>`<article class="topic" data-id="${esc(t.id)}"><div class="topic-icon"><i class="fa-solid fa-layer-group"></i></div><h3>${esc(t.name||"Untitled Topic")}</h3><p>${esc(t.description||"Practice questions from this topic.")}</p><div class="topic-foot"><span class="count">${t.count} question${t.count===1?"":"s"}</span><button class="open">Open <i class="fa-solid fa-arrow-right"></i></button></div></article>`).join("");
  g.querySelectorAll(".topic").forEach(el=>el.onclick=()=>openTopic(el.dataset.id));
}
async function openTopic(id){
  currentTopic=topics.find(t=>t.id===id); if(!currentTopic)return;
  $("topicView").style.display="none";$("questionView").style.display="block";$("topicTitle").textContent=currentTopic.name;
  $("qText").textContent="Loading questions...";
  try{
    const snap=await getDocs(query(collection(db,"questions"),where("topicId","==",id),where("active","==",true)));
    questions=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??9999)-(b.order??9999));
    currentIndex=0;answers={};renderQuestion();
  }catch(e){console.error(e);$("qText").textContent="Unable to load questions. Check Firestore rules."}
}
function renderQuestion(){
  const q=questions[currentIndex]; if(!q)return;
  $("progress").textContent=`Question ${currentIndex+1} of ${questions.length}`;
  $("qLabel").textContent=`QUESTION ${currentIndex+1}`;
  $("qText").textContent=q.text||"";
  const opts=Array.isArray(q.options)?q.options:[q.option_a,q.option_b,q.option_c,q.option_d];
  $("options").innerHTML=opts.map((o,i)=>`<div class="option ${answers[q.id]===i?"selected":""}" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="option-text">${esc(o||"")}</span></div>`).join("");
  $("options").querySelectorAll(".option").forEach(el=>el.onclick=()=>selectAnswer(q,Number(el.dataset.i)));
  $("prevBtn").classList.toggle("disabled",currentIndex===0);
  $("nextBtn").innerHTML=currentIndex===questions.length-1?'Finish <i class="fa-solid fa-check"></i>':'Next <i class="fa-solid fa-chevron-right"></i>';
  $("explanation").classList.remove("show");$("explanation").innerHTML="";
}
function selectAnswer(q,i){
  answers[q.id]=i;
  $("options").querySelectorAll(".option").forEach(x=>x.classList.remove("selected","correct","wrong"));
  $("options").querySelectorAll(".option")[i]?.classList.add("selected");
  if(q.correctIndex!==undefined){
    $("options").querySelectorAll(".option").forEach((x,idx)=>{if(idx===q.correctIndex)x.classList.add("correct");if(idx===i&&i!==q.correctIndex)x.classList.add("wrong")});
    if(q.explanation){$("explanation").innerHTML="<strong>Explanation</strong><br>"+esc(q.explanation);$("explanation").classList.add("show")}
  }
}
function showResultMessage(){
  let score=0;questions.forEach(q=>{if(answers[q.id]===q.correctIndex)score++});
  $("qText").textContent=`You completed ${questions.length} questions. Score: ${score}/${questions.length}`;
  $("qLabel").textContent="TOPIC COMPLETE";
  $("options").innerHTML='<div class="empty"><i class="fa-solid fa-circle-check"></i><h3>Practice complete</h3><p>Use the Topics button to choose another topic.</p></div>';
  $("explanation").classList.remove("show");$("prevBtn").classList.add("disabled");$("nextBtn").classList.add("disabled");
}
function showTopics(){$("questionView").style.display="none";$("topicView").style.display="block";questions=[];currentTopic=null}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body></html>
