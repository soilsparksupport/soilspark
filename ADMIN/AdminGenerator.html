<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18151546873"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}

  <script src="theme.js"></script>
  <meta charset="UTF-8" />
  <title>Create & Manage Admins | SoilSpark</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      padding: 20px;
    }

    /* main container holds both create card and admin list */
    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ----- create admin card (original design) ----- */
    .admin-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      margin: 0 auto;
    }

    .admin-card h2 {
      margin: 0 0 10px;
      text-align: center;
      font-weight: 600;
      color: #1f2937;
    }

    .admin-card p {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #1e40af;
    }

    button:active {
      transform: scale(0.98);
    }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }

    /* ----- current admins panel ----- */
    .admins-panel {
      background: #ffffff;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .admins-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    .admins-panel-header h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f2027;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admins-panel-header h3 i {
      color: #2563eb;
    }

    .admin-count-badge {
      background: #e0e7ff;
      color: #1e40af;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .admins-table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      padding: 12px 24px;
      background: #f1f5f9;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #475569;
      border-bottom: 1px solid #e2e8f0;
    }

    td {
      padding: 14px 24px;
      border-bottom: 1px solid #f1f5f9;
      color: #1e293b;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .admin-email-cell {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: #1e293b;
    }

    .admin-uid-cell {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.7rem;
      color: #64748b;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: capitalize;
    }

    .created-date {
      font-size: 0.75rem;
      color: #64748b;
    }

    .action-btn {
      background: transparent;
      border: none;
      font-size: 0.85rem;
      color: #64748b;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:hover {
      background: #f1f5f9;
      color: #0f2027;
    }

    .action-btn.delete:hover {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .empty-state i {
      font-size: 2rem;
      margin-bottom: 8px;
      display: block;
      color: #cbd5e1;
    }

    .loading-state {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }

    .loading-state i {
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* responsive adjustments */
    @media (max-width: 600px) {
      .admins-panel-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      th, td {
        padding: 10px 14px;
      }
      .admin-card {
        padding: 24px 20px;
      }
    }
  </style>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K5XJZHT26S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K5XJZHT26S', {
      page_title: document.title,
      page_location: window.location.href
    });
  </script>
</head>

<body>

  <div class="container">

    <!-- CREATE ADMIN CARD -->
    <div class="admin-card">
      <h2>Create Admin Account</h2>
      <p>Authorized access only</p>

      <div class="form-group">
        <label for="email">Admin Email</label>
        <input type="email" id="email" placeholder="admin@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>

      <button id="createAdmin">Create Admin</button>

      <div class="footer-note">
        SoilSpark Admin Panel • Secure Access
      </div>
    </div>

    <!-- CURRENT ADMINS PANEL -->
    <div class="admins-panel">
      <div class="admins-panel-header">
        <h3><i class="fas fa-users-cog"></i> Current Admins</h3>
        <span class="admin-count-badge" id="adminCount">Loading...</span>
      </div>
      <div class="admins-table-wrapper" id="adminsTableWrapper">
        <div class="loading-state">
          <i class="fas fa-spinner"></i> Loading admin accounts...
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp,
      collection,
      getDocs,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // Firebase configuration (uncomment the one you use)
    // const firebaseConfig = {
    //   apiKey: "AIzaSyCJ8Zg6qRYa2QrMbKjG4I1B3Dxg1_Z51EI",
    //   authDomain: "soilspark.firebaseapp.com",
    //   projectId: "soilspark",
    //   storageBucket: "soilspark.firebasestorage.app",
    //   messagingSenderId: "22641848933",
    //   appId: "1:22641848933:web:4c08ce5046681dbb698c8c",
    //   measurementId: "G-1M406BN9JK"
    // };

    const firebaseConfig = {
      apiKey: "AIzaSyAqBu7M4FCKx4xjsEaGAZkJVwWUjC0oJ7A",
      authDomain: "soilspark-02.firebaseapp.com",
      projectId: "soilspark-02",
      storageBucket: "soilspark-02.firebasestorage.app",
      messagingSenderId: "1076135404685",
      appId: "1:1076135404685:web:97782c1e7f93bea7b42ec4",
      measurementId: "G-3HGQCNDR9H"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ---------- CREATE ADMIN ---------- */
    document.getElementById("createAdmin").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Email and password are required");
        return;
      }

      try {
        // 1️⃣ Create auth user
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const uid = cred.user.uid;

        // 2️⃣ Create admin document USING UID
        await setDoc(doc(db, "admins", uid), {
          uid: uid,
          email: email,
          role: "admin",
          createdAt: serverTimestamp()
        });

        alert("✅ Admin created successfully using UID!");
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";

        // Refresh the admins list
        loadAdmins();
      } catch (err) {
        alert(err.message);
      }
    };

    /* ---------- LOAD & DISPLAY ADMINS ---------- */
    const adminsTableWrapper = document.getElementById("adminsTableWrapper");
    const adminCountEl = document.getElementById("adminCount");

    async function loadAdmins() {
      adminsTableWrapper.innerHTML = `
        <div class="loading-state">
          <i class="fas fa-spinner"></i> Loading admin accounts...
        </div>
      `;

      try {
        const querySnapshot = await getDocs(collection(db, "admins"));
        const admins = [];

        querySnapshot.forEach((docSnap) => {
          admins.push({ id: docSnap.id, ...docSnap.data() });
        });

        // sort by createdAt descending (newest first) if available
        admins.sort((a, b) => {
          const aTime = a.createdAt?.toMillis?.() || 0;
          const bTime = b.createdAt?.toMillis?.() || 0;
          return bTime - aTime;
        });

        adminCountEl.textContent = `${admins.length} admin${admins.length !== 1 ? 's' : ''}`;

        if (admins.length === 0) {
          adminsTableWrapper.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-user-slash"></i>
              No admin accounts found. Create one above.
            </div>
          `;
          return;
        }

        // build table
        let html = `
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>UID</th>
                <th>Role</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
        `;

        admins.forEach((admin) => {
          const createdDate = admin.createdAt?.toDate
            ? admin.createdAt.toDate().toLocaleString()
            : "—";

          const role = admin.role || "admin";
          const roleIcon = role === "superadmin" ? "fa-crown" : "fa-user-shield";

          html += `
            <tr>
              <td class="admin-email-cell">${escapeHtml(admin.email || "—")}</td>
              <td class="admin-uid-cell">${escapeHtml(admin.uid || admin.id)}</td>
              <td><span class="role-badge"><i class="fas ${roleIcon}"></i> ${escapeHtml(role)}</span></td>
              <td class="created-date">${createdDate}</td>
              <td>
                <button class="action-btn delete" data-id="${admin.id}" data-email="${escapeHtml(admin.email || '')}" title="Delete admin">
                  <i class="fas fa-trash-alt"></i> Delete
                </button>
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        adminsTableWrapper.innerHTML = html;

        // Attach delete handlers
        adminsTableWrapper.querySelectorAll(".action-btn.delete").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const id = btn.getAttribute("data-id");
            const email = btn.getAttribute("data-email");
            await deleteAdmin(id, email);
          });
        });

      } catch (err) {
        console.error("Error loading admins:", err);
        adminsTableWrapper.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i>
            Failed to load admins: ${escapeHtml(err.message)}
          </div>
        `;
        adminCountEl.textContent = "Error";
      }
    }

    /* ---------- DELETE ADMIN ---------- */
    async function deleteAdmin(adminDocId, email) {
      const confirmed = confirm(
        `Are you sure you want to remove admin "${email}"?\n\n` +
        `Note: This removes the admin record from Firestore. ` +
        `The Firebase Authentication user will remain unless deleted separately.`
      );
      if (!confirmed) return;

      try {
        await deleteDoc(doc(db, "admins", adminDocId));
        alert(`✅ Admin record "${email}" removed.`);
        loadAdmins();
      } catch (err) {
        alert("Error deleting admin: " + err.message);
      }
    }

    /* ---------- UTILITY: escape HTML ---------- */
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* ---------- INITIAL LOAD ---------- */
    loadAdmins();

  </script>

</body>

<script>
  (function () {
    // Disable right click
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    // Disable common copy shortcuts
    document.addEventListener('keydown', function (e) {
      const key = e.key.toLowerCase();

      // Ctrl+C, Ctrl+X, Ctrl+S, Ctrl+U, Ctrl+A, Ctrl+P
      if (e.ctrlKey && ['c', 'x', 's', 'u', 'a', 'p'].includes(key)) {
        e.preventDefault();
      }

      // Ctrl+Shift+I, Ctrl+Shift+J
      if (e.ctrlKey && e.shiftKey && ['i', 'j'].includes(key)) {
        e.preventDefault();
      }

      // F12
      if (e.key === 'F12') {
        e.preventDefault();
      }
    });

    // Disable text selection
    document.addEventListener('selectstart', function (e) {
      e.preventDefault();
    });

    // Disable copy/cut events
    document.addEventListener('copy', function (e) {
      e.preventDefault();
    });

    document.addEventListener('cut', function (e) {
      e.preventDefault();
    });
  })();
</script>

<style>
  body {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
</style>

</html>
